<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>Open FxLens</title>
  <meta name="robots" content="noindex" />
  <meta name="apple-itunes-app" content="app-id=6748287547" />
  <link rel="icon" type="image/x-icon" href="/favicon.ico" />
  <meta name="theme-color" content="#000000" />
  <style>
    :root{--ink:#000;--panel:#0c0c0d;--line:#262626;--text:#f5f5f5;--dim:#a8a8a8;--teal:#2dd4bf}
    *{box-sizing:border-box}
    body{margin:0;min-height:100vh;display:grid;place-items:center;background:var(--ink);color:var(--text);font:16px/1.55 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;padding:24px}
    .card{width:100%;max-width:380px;text-align:center}
    .icon{width:76px;height:76px;border-radius:20px;margin:0 auto 18px;display:block}
    h1{margin:0;font-size:24px;letter-spacing:-.01em}
    p{margin:8px 0 0;color:var(--dim)}
    .btn{display:block;margin-top:24px;padding:15px 20px;border-radius:14px;background:var(--teal);color:#04211e;font-weight:700;text-decoration:none;font-size:16px}
    .btn:focus-visible{outline:2px solid var(--teal);outline-offset:3px}
    .stores{display:flex;gap:10px;justify-content:center;margin-top:18px;flex-wrap:wrap}
    .stores a{display:inline-flex;align-items:center;gap:8px;padding:10px 14px;border-radius:12px;border:1px solid var(--line);color:var(--text);text-decoration:none;font-size:14px;font-weight:600}
    .hint{font-size:13px;margin-top:20px}
  </style>
</head>
<body>
  <main class="card">
    <img class="icon" src="/fxlens_icon.png" alt="FxLens" />
    <h1 id="title">Opening FxLens…</h1>
    <p id="sub">If the app doesn’t open, tap the button below.</p>
    <a class="btn" id="open" href="fxlens:///">Open the FxLens app</a>
    <div class="stores">
      <a href="https://apps.apple.com/app/id6748287547">App Store</a>
      <a href="https://play.google.com/store/apps/details?id=com.danieldon.fxlens">Google Play</a>
    </div>
    <p class="hint">Don’t have FxLens yet? Get it free from your app store.</p>
  </main>
  <script>
    // /to/<screen> → the same screen in the app via its own link scheme.
    var ROUTES = { home: "", analyze: "trade-setup", townhall: "townhall", signals: "daily", live: "live-classes" };
    var key = (location.pathname.split("/")[2] || "home").toLowerCase();
    var titles = { analyze: "Analyse your next chart", townhall: "Open Townhall", signals: "See today’s signals", live: "Live classes" };
    if (titles[key]) document.getElementById("title").textContent = titles[key];
    var deep = "fxlens:///" + (ROUTES[key] !== undefined ? ROUTES[key] : "");
    document.getElementById("open").href = deep;
    // Try once automatically (works in Safari and Chrome; some mail apps need the tap).
    setTimeout(function () { location.href = deep; }, 300);
  </script>
</body>
</html>
