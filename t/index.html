<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Townhall – Fxlens</title>
  <meta name="description" content="A post from Townhall, where FxLens traders share takes, wins, and setups." />
  <link rel="icon" type="image/x-icon" href="/favicon.ico" />
  <style>
    :root {
      color-scheme: dark;
      --bg: #070B16; --card: #0D1322; --line: rgba(255,255,255,0.08);
      --text: #EEF3FC; --muted: #A8B3C9; --dim: #5D6A87; --teal: #2DD4BF;
    }
    * { box-sizing: border-box; }
    body { margin: 0; background: var(--bg); color: var(--text); font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, Roboto, Helvetica, Arial, sans-serif; line-height: 1.6; }
    .wrap { max-width: 560px; margin: 0 auto; padding: 26px 18px 70px; }
    .brand { display: flex; align-items: center; gap: 9px; text-decoration: none; color: var(--text); font-weight: 700; font-size: 15px; }
    .brand img { width: 26px; height: 26px; border-radius: 7px; }
    .eyebrow { margin-top: 26px; font-size: 11px; letter-spacing: 0.22em; color: var(--teal); font-weight: 800; }
    .card { margin-top: 12px; background: var(--card); border: 1px solid var(--line); border-radius: 20px; padding: 20px; }
    .author { display: flex; align-items: center; gap: 12px; }
    .ava { width: 44px; height: 44px; border-radius: 999px; object-fit: cover; background: #1B2330; }
    .ava.fallback { display: flex; align-items: center; justify-content: center; font-weight: 700; color: var(--teal); }
    .who b { font-size: 15px; }
    .who span { display: block; color: var(--teal); font-size: 12.5px; }
    .pro { display: inline-block; margin-left: 6px; font-size: 9px; font-weight: 800; letter-spacing: 0.1em; color: #052e2b; background: var(--teal); border-radius: 999px; padding: 2px 6px; vertical-align: 2px; }
    .text { margin-top: 14px; font-size: 15.5px; line-height: 1.65; white-space: pre-wrap; }
    .fade { position: relative; max-height: 150px; overflow: hidden; }
    .fade::after { content: ""; position: absolute; left: 0; right: 0; bottom: 0; height: 70px; background: linear-gradient(transparent, var(--card)); }
    .post-img { margin-top: 14px; width: 100%; border-radius: 14px; display: block; max-height: 300px; object-fit: cover; }
    .stats { display: flex; gap: 18px; margin-top: 14px; color: var(--dim); font-size: 13px; }
    .stats b { color: var(--muted); }
    h2 { margin: 30px 0 4px; font-size: 12px; letter-spacing: 0.18em; color: var(--dim); font-weight: 800; }
    .comment { border-top: 1px solid var(--line); padding: 12px 2px; }
    .comment b { font-size: 13px; }
    .comment span { color: var(--teal); font-size: 12px; margin-left: 5px; }
    .comment p { margin: 3px 0 0; color: var(--muted); font-size: 13.5px; }
    .locked { margin-top: 6px; padding: 14px 2px; border-top: 1px solid var(--line); color: var(--dim); font-size: 13px; filter: none; }
    .cta { margin-top: 30px; text-align: center; }
    .open-app { display: block; background: var(--teal); color: #052e2b; border-radius: 14px; padding: 15px; font-weight: 800; font-size: 15px; text-decoration: none; }
    .cta p { color: var(--muted); font-size: 13px; margin: 18px 0 12px; }
    .badges { display: flex; gap: 12px; justify-content: center; align-items: center; flex-wrap: wrap; }
    .badges img { height: 44px; }
    .state { margin-top: 90px; text-align: center; color: var(--dim); font-size: 15px; }
    .state a { color: var(--teal); text-decoration: none; }
  </style>
</head>
<body>
  <div class="wrap">
    <a class="brand" href="/"><img src="/fxlens_icon.png" alt="" />Fxlens</a>

    <div id="loading" class="state">Loading post…</div>
    <div id="notfound" class="state" style="display:none">
      This post isn't available.<br /><br /><a href="/">← fxlens.app</a>
    </div>

    <div id="post" style="display:none">
      <div class="eyebrow">TOWNHALL</div>
      <div class="card">
        <div class="author">
          <img id="ava" class="ava" alt="" style="display:none" />
          <div id="avaFallback" class="ava fallback" style="display:none"></div>
          <div class="who">
            <b id="name"></b><span id="proBadge" class="pro" style="display:none">PRO</span>
            <span id="handle"></span>
          </div>
        </div>
        <div id="textWrap" class="text"><span id="text"></span></div>
        <img id="postImg" class="post-img" style="display:none" alt="" />
        <div class="stats">
          <div><b id="sLikes">0</b> reactions</div>
          <div><b id="sComments">0</b> comments</div>
          <div><b id="sViews">0</b> views</div>
        </div>
      </div>

      <div id="commentsSection" style="display:none">
        <h2>TRADERS ARE SAYING</h2>
        <div id="comments"></div>
        <div class="locked" id="moreLine" style="display:none"></div>
      </div>

      <div class="cta">
        <a id="openApp" class="open-app" href="#">Open the full post in FxLens</a>
        <p>Join the conversation — takes, wins, and setups from real traders.</p>
        <div class="badges">
          <a href="https://apps.apple.com/app/id6748287547"><img src="/appstore_download.png" alt="Download on the App Store" /></a>
          <a href="https://play.google.com/store/apps/details?id=com.danieldon.fxlens"><img src="/playstore-badge.svg" alt="Get it on Google Play" /></a>
        </div>
      </div>
    </div>
  </div>

  <script>
    (async function () {
      var m = location.pathname.match(/^\/t\/([a-zA-Z0-9_-]{5,64})\/?$/);
      var show = function (id) { document.getElementById(id).style.display = ""; };
      var hide = function (id) { document.getElementById(id).style.display = "none"; };
      var text = function (id, v) { document.getElementById(id).textContent = v; };
      if (!m) { hide("loading"); show("notfound"); return; }
      var postId = m[1];

      // "Open in app" tries the custom scheme; if the app isn't installed the
      // page simply stays put with the store badges right below.
      var openApp = document.getElementById("openApp");
      openApp.addEventListener("click", function (e) {
        e.preventDefault();
        window.location.href = "fxlens://t/" + postId;
      });

      try {
        var res = await fetch("/api/townhall/" + encodeURIComponent(postId));
        if (!res.ok) throw new Error("not found");
        var p = (await res.json()).data;

        document.title = (p.authorHandle ? "@" + p.authorHandle : p.authorName) + " on Townhall – Fxlens";
        text("name", p.authorName);
        if (p.authorPro) show("proBadge");
        text("handle", p.authorHandle ? "@" + p.authorHandle : "");
        if (p.authorImage) {
          var ava = document.getElementById("ava");
          ava.src = p.authorImage; ava.style.display = "";
        } else {
          var fb = document.getElementById("avaFallback");
          fb.textContent = (p.authorName || "F").slice(0, 1).toUpperCase();
          fb.style.display = "flex";
        }

        text("text", p.text);
        // Excerpt behavior: the API already truncates; fade long text so it
        // visibly continues "in the app".
        if (p.text.length >= 275) document.getElementById("textWrap").classList.add("fade");

        if (p.imageUrl) {
          var img = document.getElementById("postImg");
          img.src = p.imageUrl; img.style.display = "";
        }
        text("sLikes", p.likeCount);
        text("sComments", p.commentCount);
        text("sViews", p.viewCount);

        if (p.comments && p.comments.length) {
          var box = document.getElementById("comments");
          p.comments.forEach(function (c) {
            var d = document.createElement("div");
            d.className = "comment";
            var b = document.createElement("b"); b.textContent = c.authorName;
            var s = document.createElement("span"); s.textContent = c.authorHandle ? "@" + c.authorHandle : "";
            var pr = document.createElement("p"); pr.textContent = c.text;
            d.appendChild(b); d.appendChild(s); d.appendChild(pr);
            box.appendChild(d);
          });
          var remaining = p.commentCount - p.comments.length;
          if (remaining > 0) {
            var more = document.getElementById("moreLine");
            more.textContent = "+ " + remaining + " more repl" + (remaining === 1 ? "y" : "ies") + " in the app";
            more.style.display = "";
          }
          show("commentsSection");
        }

        hide("loading"); show("post");
      } catch (e) {
        hide("loading"); show("notfound");
      }
    })();
  </script>
</body>
</html>
